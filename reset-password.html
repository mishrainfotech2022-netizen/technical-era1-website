
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technical ERA1 - Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      font-family: Arial, sans-serif;
      color: white;
    }
    .box {
      width: min(360px, 85%);
      padding: 30px;
      background: #1e293b;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      border: 0;
    }
    button {
      background: #16a34a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Technical ERA1</h2>
    <h3>Reset Your Password</h3>

    <form id="resetForm">
      <input id="password" type="password"
        placeholder="Enter new password" minlength="6" required>
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password" minlength="6" required>
      <button type="submit">Update Password</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://dcvsvbfcxplbgbezilyh.supabase.co";
    const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    async function checkRecovery() {
      const { data, error } = await db.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Invalid or expired recovery link. Please request a new one.";
        form.style.display = "none";
      }
    }

    checkRecovery();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await db.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
      } else {
        message.textContent = "Password updated successfully! You can now log in.";
        form.style.display = "none";
      }
    });
  </script>
</body>
</html>
